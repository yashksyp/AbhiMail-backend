services:
  # 1. Background Worker (BullMQ + Nodemailer)
  - type: worker
    name: abhimail-worker
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: node src/services/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: abhimail-redis
          property: connectionString
      - key: APP_URL
        value: https://YOUR_APP_URL.onrender.com

  # 2. Main API Server (Express)
  - type: web
    name: abhimail-api
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: abhimail-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

# 3. Redis Cache (Queue)
  - type: redis
    name: abhimail-redis
    ipAllowList: []
